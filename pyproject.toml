[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genitool"
version = "0.1.0"
description = "Nmap, fuzzing, Wappalyzer e CVEs com evidências em TXT"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
genitool = "genitool.cli:main"

[tool.setuptools.packages.find]
include = ["genitool*"]

[tool.setuptools.package-data]
genitool = ["data/*.txt", "*.cjs"]
